<!DOCTYPE html>
<html>
<head>
    <style>
        body { display: flex; flex-direction: column; align-items: center; background-color: #f0f0f0; font-family: sans-serif; }
        canvas { border: 1px solid black; background-color: white; cursor: crosshair; }
        .info { margin-bottom: 10px; }
    </style>
</head>
<body>

<canvas id="canvas" width="600" height="400"></canvas>

<script>
    var canvas;
    var ctx;
    var isDown = false; 

    function init() {
        canvas = document.getElementById('canvas');
        ctx = canvas.getContext('2d');
        
        canvas.addEventListener("mousemove", drawTrail);
        
        canvas.addEventListener("mousedown", function() { isDown = true; });
        canvas.addEventListener("mouseup", function() { isDown = false; });
        
        canvas.addEventListener("mouseleave", function() { isDown = false; });
    }

    function drawTrail(event) {
        var x = event.offsetX;
        var y = event.offsetY;

        if (isDown) {
            ctx.fillStyle = "red";
        } else {
            ctx.fillStyle = "blue";
        }
        ctx.fillRect(x, y, 10, 10); 
    }
</script>

<body onload="init();">
</body>
</html>
