<!DOCTYPE html>
<html>
<head>
<script>
	var x=50, y=50;
	var canvas;
	var ctx;
	
	var size = 20;
	var color = 'blue';

	function init() {
		canvas = document.getElementById('canvas');
		ctx = canvas.getContext('2d');
		
		ctx.strokeStyle = 'black';
		ctx.strokeRect(0,0,640,480);
		
		ctx.fillStyle = color;
		ctx.fillRect(x,y,size,size);
		
		document.addEventListener("keydown", move);
		
		updateStatus();
	}

	function updateStatus() {
		document.getElementById("x").value = "x=" + x + " | Size: " + size + " | Color: " + color;
		document.getElementById("y").value = "y=" + y;
	}

	function move(event) {
		ctx.clearRect(0, 0, canvas.width, canvas.height);
		
		ctx.strokeRect(0, 0, canvas.width, canvas.height);

		if (event.keyCode == 38) {y-=5;}
		else if (event.keyCode == 40) {y+=5;}
		else if (event.keyCode == 39) {x+=5;}
		else if (event.keyCode == 37) {x-=5;}
		
		else if (event.keyCode == 49) {color = 'red';}
		else if (event.keyCode == 50) {color = 'green';}
		else if (event.keyCode == 51) {color = 'blue';}

		else if (event.keyCode == 66 || event.keyCode == 98) {size = 30;}
		else if (event.keyCode == 77 || event.keyCode == 109) {size = 20;}
		else if (event.keyCode == 83 || event.keyCode == 115) {size = 10;}

		ctx.fillStyle = color;
		ctx.fillRect(x, y, size, size);
		
		updateStatus();
	}
</script>
</head>
<body onload="init();">
    <input type="text" id="x" readonly><input type="text" id="y" readonly><br>
    <canvas id="canvas" width="640" height="480"></canvas>
</body>
</html>
